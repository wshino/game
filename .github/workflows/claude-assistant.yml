name: Claude Assistant

on:
  # Issueが作成・アサイン・ラベル付けされた時
  issues:
    types: [opened, assigned, labeled]

  # Issue/PRへのコメント (レビューボットのコメントも含む)
  issue_comment:
    types: [created]

  # PRレビューコメント
  pull_request_review_comment:
    types: [created]

  # PRレビュー提出時 (changes_requested で自動対応)
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-response:
    # 実行条件:
    # 1. auto-implementラベル付きIssue作成時
    # 2. @claudeメンション時 (Bot以外)
    # 3. PRコメントに「[REQUIRES_FIX]」マーカーが含まれる場合 (レビューボットの指摘に自動対応)
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'auto-implement')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '[REQUIRES_FIX]')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PRコメントの場合はPRのブランチをチェックアウト
          ref: ${{ github.event.issue.pull_request && github.event.pull_request.head.ref || github.ref }}

      - name: Checkout PR branch (for issue_comment on PR)
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          gh pr checkout $PR_NUMBER
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 状況に応じた指示
          custom_instructions: |
            # プロジェクト固有の指示

            ## レビュー対応 (PRコメントに「🚨 必須修正」がある場合)
            レビューで指摘された必須修正事項がある場合:
            1. 指摘内容を確認し、修正が必要な箇所を特定
            2. 指摘に従ってコードを修正
            3. `npm test` でテストを実行して問題がないことを確認
            4. 修正をコミットしてプッシュ (PRブランチに直接プッシュ)
            5. 修正内容をPRにコメントで報告

            **重要**: 「🔧 改善提案」は任意なので対応不要。「🚨 必須修正」のみ対応すること。

            ## 新規実装フロー (auto-implementラベル付きIssueの場合)
            1. `openspec/project.md` と `openspec/AGENTS.md` を読む
            2. Issueに記載されたSpec配下のファイルを全て確認
            3. Specに書かれた範囲のみ実装
            4. `npm test` でテストを実行
            5. 変更をコミットしてプッシュ
            6. **必ず `gh pr create` でPRを作成** (これを省略しないこと!)

            ## PR作成 (重要・必須)
            実装が完了したら、以下のコマンドで必ずPRを作成してください:
            ```
            gh pr create --title "feat: [機能名]" --body "Closes #$ISSUE_NUMBER"
            ```
            - PRを作成しないと実装が完了したとみなされません
            - ブランチをプッシュしただけでは不十分です

            ## コーディング規約
            - コメントは日本語で記述
            - Vanilla JavaScript (フレームワークなし)
            - ES6+ モジュール形式

            ## 問題発生時
            実装中に不明点や判断に迷う点があれば:
            1. 作業を一旦停止
            2. このIssue/PRにコメントで質問
            3. @${{ github.repository_owner }} をメンションして通知

          # gh CLIを許可してPR作成を可能にする
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,Bash(gh:*)"
          timeout_minutes: 30
